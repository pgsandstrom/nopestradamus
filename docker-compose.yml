services:
  frontend:
    build:
      dockerfile: ./Dockerfile.frontend
    ports:
      - "8300:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mail:
        condition: service_started
    environment:
      - PGHOST=db
    restart: always
  cron:
    build:
      dockerfile: ./Dockerfile.cron
    depends_on:
      migrate:
        condition: service_completed_successfully
      mail:
        condition: service_started
    environment:
      - PGHOST=db
    restart: always
  # The postfix both of the above hand their mail to. A mail counts as sent once it is queued here,
  # so the queue is a volume: a release replaces the container, not the mail still waiting in it.
  # No ports on purpose: only containers on this compose network can reach it.
  mail:
    build:
      dockerfile: ./Dockerfile.mail
    volumes:
      - mail-queue:/var/spool/postfix
    restart: always
  # Runs the pending migrations and exits, before frontend and cron are allowed to start, so a
  # release that cannot migrate fails instead of putting app code on a schema it does not know.
  # `restart: no` keeps it a one-shot: after a host reboot the daemon brings the two `always`
  # services back on its own and this stays exited, which is right — the schema is already there.
  migrate:
    build:
      dockerfile: ./Dockerfile.migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PGHOST=db
    restart: "no"
  db:
    image: postgres:18
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=nopestradamus
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nopestradamus"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No /docker-entrypoint-initdb.d mount: that only ever runs on an empty data directory, so
    # it could not touch a database that already exists. The migrate service owns the schema.
    volumes:
      # 18 keeps its data in /var/lib/postgresql/18/docker, so the volume mounts one level up
      - db18:/var/lib/postgresql
volumes:
  db18:
  mail-queue:
